services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: projectapp
      POSTGRES_PASSWORD: projectapp
      POSTGRES_DB: projectapp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/projectapp
      SPRING_DATASOURCE_USERNAME: projectapp
      SPRING_DATASOURCE_PASSWORD: projectapp

volumes:
  postgres-data:
