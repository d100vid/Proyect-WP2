server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:projectapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:projectapp}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
logging.level.org.springframework=INFO
